<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라임에게 물어보기</title>
<style>
  :root {
    --bg: #f4f6f3;
    --panel: #ffffff;
    --ink: #1c2620;
    --muted: #6b7772;
    --accent: #1f7a4d;      /* 딥그린 (라임/시트러스에서 딴 차분한 톤) */
    --accent-soft: #e4f0e9;
    --user-bubble: #1f7a4d;
    --bot-bubble: #eef1ee;
    --line: #e2e7e3;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
                 "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  header .kicker {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  header h1 {
    margin: 4px 0 2px;
    font-size: 20px;
    font-weight: 600;
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .stream {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .msg.bot.pending { color: var(--muted); font-style: italic; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 12px;
  }
  .suggestions button {
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .suggestions button:hover { border-color: var(--accent); }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 24px 20px;
    border-top: 1px solid var(--line);
  }
  #input {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="kicker">RAG chatbot</div>
      <h1>라임에게 물어보기</h1>
      <p>라임에 대해 궁금한 걸 자유롭게 물어보세요.</p>
    </header>

    <div class="stream" id="stream">
      <div class="msg bot">안녕하세요! 저는 라임을 소개하는 챗봇이에요. 무엇이 궁금하신가요?</div>
    </div>

    <div class="suggestions" id="suggestions">
      <button>라임은 어떤 사람이야?</button>
      <button>어떤 일을 해?</button>
      <button>취미가 뭐야?</button>
    </div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요…" autocomplete="off"></textarea>
      <button id="send" type="submit">보내기</button>
    </form>
  </div>

<script>
  const stream = document.getElementById('stream');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const suggestions = document.getElementById('suggestions');

  function addMessage(text, who, pending) {
    const el = document.createElement('div');
    el.className = 'msg ' + who + (pending ? ' pending' : '');
    el.textContent = text;
    stream.appendChild(el);
    stream.scrollTop = stream.scrollHeight;
    return el;
  }

  async function ask(message) {
    addMessage(message, 'user');
    input.value = '';
    input.style.height = 'auto';
    send.disabled = true;
    suggestions.style.display = 'none';

    const thinking = addMessage('생각 중…', 'bot', true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      if (!res.ok) throw new Error('서버 오류 ' + res.status);
      const data = await res.json();
      thinking.classList.remove('pending');
      thinking.textContent = data.answer;
    } catch (err) {
      thinking.classList.remove('pending');
      thinking.textContent = '지금은 답변을 불러올 수 없어요. 잠시 후 다시 시도해 주세요.';
    } finally {
      send.disabled = false;
      stream.scrollTop = stream.scrollHeight;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text) ask(text);
  });

  // Enter 전송, Shift+Enter 줄바꿈
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // 입력창 높이 자동 조절
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  // 추천 질문 클릭
  suggestions.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => ask(btn.textContent));
  });
</script>
</body>
</html>
